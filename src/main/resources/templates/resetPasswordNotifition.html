<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Password Changed Successfully</title>
    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background-color: #f9fafb;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background: #ffffff;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
            padding: 30px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 22px;
            color: #374151;
            margin-top: 10px;
        }

        h2 {
            color: #111827;
            font-size: 18px;
            margin-bottom: 10px;
        }

        p {
            color: #4b5563;
            line-height: 1.6;
            font-size: 16px;
        }

        .success-badge {
            display: inline-block;
            margin: 10px 0;
            padding: 10px 24px;
            background: #22c55e;
            color: #ffffff;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
        }

        .warning {
            background: #fef9c3;
            border-left: 4px solid #eab308;
            padding: 12px 16px;
            border-radius: 4px;
            font-size: 14px;
            color: #713f12;
            margin-top: 20px;
        }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #9ca3af;
            text-align: center;
        }
    </style>
</head>

<body>
<div class="container">
    <table width="100%" cellpadding="0" cellspacing="0">
        <tr>
            <td align="center" class="header">
                <h1>PTIT ShoeShop</h1>
            </td>
        </tr>

        <tr>
            <td>
                <h2>Xin chào, <span th:text="${username}">User</span>!</h2>
                <p>
                    Mật khẩu của tài khoản bạn đã được <strong>thay đổi thành công</strong>.
                </p>
                <p style="text-align: center;">
                    <span class="success-badge">✔ Đổi mật khẩu thành công</span>
                </p>
                <div class="warning">
                    ⚠️ Nếu bạn <strong>không thực hiện</strong> thay đổi này, vui lòng liên hệ ngay với chúng tôi
                    qua email <strong>support@ptitsneaker.vn</strong> để được hỗ trợ.
                </div>
            </td>
        </tr>

        <tr>
            <td class="footer">
                <p>&copy; 2025 PTIT ShoeShop Online. All rights reserved.</p>
            </td>
        </tr>
    </table>
</div>
</body>

</html>
