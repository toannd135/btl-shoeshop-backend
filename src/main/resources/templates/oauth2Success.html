<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập thành công</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0fdf4; /* nền xanh lá rất nhạt */
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            text-align: center;
            background: #ffffff;
            padding: 40px 50px;
            border-radius: 14px;
            box-shadow: 0 6px 20px rgba(22, 163, 74, 0.15);
            border-top: 6px solid #16a34a; /* viền xanh lá trên */
        }
        .icon {
            width: 90px;
            height: 90px;
            background: #dcfce7; /* xanh lá nhạt */
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
        }
        .icon svg {
            width: 48px;
            height: 48px;
            stroke: #16a34a; /* xanh lá chủ đạo */
            stroke-width: 2.5;
            fill: none;
        }
        h2 {
            color: #15803d; /* xanh lá đậm */
            margin-bottom: 10px;
        }
        p {
            color: #444;
            font-size: 15px;
            margin-bottom: 20px;
        }
        a {
            display: inline-block;
            padding: 12px 22px;
            background: #16a34a;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            transition: 0.3s ease;
        }
        a:hover {
            background: #15803d;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(22,163,74,0.3);
        }
    </style>
</head>
<body>
<div class="container">
    <div class="icon">
        <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M8 12.5l2.2 2.2L16 9"></path>
        </svg>
    </div>

    <h2>Đăng nhập thành công!</h2>
    <p>Chào mừng bạn đã quay trở lại Shoeshop.<br>
        Quá trình đăng nhập bằng Google đã hoàn tất.</p>

    <!-- Chúng ta sẽ dùng domain cấu hình hoặc mặc định về frontend -->
    <a th:href="${frontendUrl ?: 'http://localhost:5173'}">Truy cập vào cửa hàng</a>
</div>
</body>
</html>
